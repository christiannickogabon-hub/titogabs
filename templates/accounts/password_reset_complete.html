{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete - Santa Fe, Leyte AlertGov{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0"><i class="fas fa-check-circle"></i> Password Reset Complete</h3>
                </div>
                <div class="card-body">
                    <p>Your password has been updated successfully.</p>
                    <p>You can now sign in with your new password.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary btn-block">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
