{% extends "base.html" %}
{% load static %}

{% block title %}Password Changed - Municipality of Carigara, Leyte AlertGov{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card" style="border: 2px solid #00bcd4;">
                <div class="card-header" style="background: linear-gradient(90deg, #0f1419, #1a2332); padding: 2rem; text-align: center; border-bottom: 2px solid #00bcd4;">
                    <div style="font-size: 3rem; color: #28a745; margin-bottom: 1rem;"><i class="fas fa-check-circle"></i></div>
                    <h2 style="color: #28a745; font-weight: 700; margin-bottom: 0;">Success!</h2>
                </div>
                <div class="card-body" style="padding: 2.5rem; text-align: center;">
                    <p style="color: #e8f0f5; font-size: 1.1rem; margin-bottom: 1rem;">Your password has been successfully changed.</p>
                    <p style="color: #a0aab5; margin-bottom: 2rem;">Your account is now secure with your new password.</p>
                    <a href="{% url 'profile' %}" class="btn btn-primary w-100" style="padding: 0.75rem; font-weight: 600;">
                        <i class="fas fa-user"></i> Back to Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
